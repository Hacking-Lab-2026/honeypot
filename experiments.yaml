# Experiments loaded at honeypot startup.
# Loading is idempotent: experiments with matching names are skipped on re-run.
#
# Only one experiment should have auto_start: true at a time.
# Others can be started manually via:
#   curl -X POST http://localhost:8080/experiments/<id>/start
# (find the id with: curl http://localhost:8080/experiments)

experiments:

  # -----------------------------------------------------------------------------
  # Week 2 baseline: response size comparison.
  # Control returns a minimal response; Proper returns amplified responses for
  # both DNS (~67x) and NTP (~330x via mode 7 monlist with 36 fake peers).
  # -----------------------------------------------------------------------------
  - name: "Response Size Study"
    description: "Compare minimal vs. amplified DNS/NTP response sizes across two honeypot IPs"
    assignment_mode: "destination"
    auto_start: false
    variants:
      - name: "Control"
        description: "Minimal DNS and minimal NTP"
        weight: 0.0
        assigned_ips:
          - "127.0.0.1"
        dns_config:
          response_mode: "minimal"
          realistic_ttl: true
        ntp_config:
          response_mode: "minimal"
          num_peers: 0
      - name: "Proper"
        description: "Amplified DNS (TXT records) and amplified NTP (36-peer monlist)"
        weight: 0.0
        assigned_ips:
          - "192.168.2.5"
        dns_config:
          response_mode: "amplified"
          realistic_ttl: false
        ntp_config:
          response_mode: "amplified"
          num_peers: 36

  # -----------------------------------------------------------------------------
  # Week 3 Part 1: realistic padding.
  # Proper uses realistic_padding so TXT records look like SPF/DKIM strings
  # instead of obvious AAAA... padding. Same byte count, different plausibility.
  # -----------------------------------------------------------------------------
  - name: "Realistic Padding Test"
    description: "Compare obvious vs. realistic TXT padding at identical response sizes"
    assignment_mode: "destination"
    auto_start: false
    variants:
      - name: "Control"
        description: "Minimal response with realistic TTL"
        weight: 0.0
        assigned_ips:
          - "127.0.0.1"
        dns_config:
          response_mode: "minimal"
          realistic_ttl: true
      - name: "Proper"
        description: "Amplified response with SPF/DKIM-style TXT padding"
        weight: 0.0
        assigned_ips:
          - "192.168.2.5"
        dns_config:
          response_mode: "amplified"
          realistic_padding: true
          response_ttl: 300

  # -----------------------------------------------------------------------------
  # Week 3 Part 2: multi-protocol (DNS + NTP) per variant.
  # Each variant defines both dns_config and ntp_config; the honeypot dispatches
  # per protocol based on which port the request arrived on.
  # NTP Proper uses num_peers=10 → 2 multi-packet monlist responses.
  # -----------------------------------------------------------------------------
  - name: "Multi-Protocol Test"
    description: "Combined DNS and NTP variants per honeypot IP"
    assignment_mode: "destination"
    auto_start: false
    variants:
      - name: "Control"
        description: "Minimal DNS and minimal NTP (non-amplifying)"
        weight: 0.0
        assigned_ips:
          - "127.0.0.1"
        dns_config:
          response_mode: "minimal"
          realistic_ttl: true
        ntp_config:
          response_mode: "minimal"
          num_peers: 0
      - name: "Proper"
        description: "Amplified DNS with realistic padding + amplified NTP monlist (10 peers)"
        weight: 0.0
        assigned_ips:
          - "192.168.2.5"
        dns_config:
          response_mode: "amplified"
          realistic_padding: true
        ntp_config:
          response_mode: "amplified"
          num_peers: 10
  
  # -----------------------------------------------------------------------------
  # Full SSDP test: DNS + NTP + SSDP per variant.
  # -----------------------------------------------------------------------------
  - name: "Full Option"
    description: "Test SSDP together with DNS and NTP"
    assignment_mode: "destination"
    auto_start: true
    variants:
      - name: "Control"
        description: "Minimal across all protocols"
        weight: 0.0
        assigned_ips:
          - "127.0.0.1"
        dns_config:
          response_mode: "minimal"
          realistic_ttl: true
        ntp_config:
          response_mode: "minimal"
          num_peers: 0
        ssdp_config:
          response_mode: "minimal"
          num_services: 0
      - name: "Proper"
        description: "Amplified across all protocols"
        weight: 0.0
        assigned_ips:
          - "192.168.2.5"
        dns_config:
          response_mode: "amplified"
          realistic_padding: true
        ntp_config:
          response_mode: "amplified"
          num_peers: 36
        ssdp_config:
          response_mode: "amplified"
          num_services: 10